[package]
name = "cortex"
version = "0.1.0"
description = "Local-first knowledge base where every screenshot becomes searchable text"
authors = ["Ageu Menezes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cortex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview show a screenshot straight from the
# vault instead of copying every image through IPC.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source with SQLITE_ENABLE_FTS5 already set,
# so full-text search needs no system library and no extra build flags.
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.7"
pulldown-cmark = "0.13"
blake3 = "1"
walkdir = "2"
anyhow = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
