[package]
name = "cortex"
version = "0.1.0"
description = "Local-first knowledge base where every screenshot becomes searchable text"
authors = ["Ageu Menezes"]
edition = "2021"
# `src/bin/cortex-mcp.rs` is a second binary; without this `tauri dev` cannot tell
# which one is the app.
default-run = "cortex"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cortex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview show a screenshot straight from the
# vault instead of copying every image through IPC.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source with SQLITE_ENABLE_FTS5 already set,
# so full-text search needs no system library and no extra build flags.
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.7"
pulldown-cmark = "0.13"
blake3 = "1"
walkdir = "2"
anyhow = "1"
dirs = "6"
scraper = "0.27"
# Must track the version scraper itself uses, or the node types differ.
ego-tree = "0.11"
# The phone talks to this. tokio, hyper and tower are already in the tree via
# Tauri, so axum sits on what is here instead of bringing a second stack.
axum = "0.8"
tokio = { version = "1", features = ["net", "rt"] }
# The web bundle travels inside the .app; nothing loose to lose next to it.
include_dir = "0.7"
fastembed = { version = "6.0.0", default-features = false, features = ["hf-hub", "hf-hub-native-tls", "ort-download-binaries-native-tls"] }
# The official MCP SDK, pinned: `cortex-mcp serve` speaks the protocol over stdio.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
# Must track the major rmcp derives its tool schemas with.
schemars = "1"

[dev-dependencies]
tempfile = "3"
# The server is tested through a real client over a real child process.
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt", "process"] }
